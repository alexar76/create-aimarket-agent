name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m build --wheel
      - name: Build a generated agent image
        run: |
          target="${RUNNER_TEMP}/generated-agent"
          create-aimarket-agent "CI Agent" --no-metis --directory "${target}"
          docker build -t generated-aimarket-agent:test "${target}"
