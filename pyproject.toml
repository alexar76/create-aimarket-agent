[project]
name = "create-aimarket-agent"
version = "0.1.0"
description = "Scaffold a minimal AIMarket Protocol v2 capability provider"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.urls]
Documentation = "https://github.com/alexar76/create-aimarket-agent#readme"
Issues = "https://github.com/alexar76/create-aimarket-agent/issues"
Repository = "https://github.com/alexar76/create-aimarket-agent"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
create-aimarket-agent = "create_aimarket_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/create_aimarket_agent"]

# Explicit sdist allow-list so hatchling does not walk up to the monorepo .gitignore
# (and so template `.env.example` / nested scaffold files stay intentional package content).
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/.gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=create_aimarket_agent --cov-branch --cov-report=term-missing --cov-fail-under=95"
