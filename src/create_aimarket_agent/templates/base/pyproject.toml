[project]
name = "__PROJECT_SLUG__"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cryptography>=44", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "provider_signing", "configure_provider", "validate_manifest"]

[tool.pytest.ini_options]
testpaths = ["."]
